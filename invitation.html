<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYERIM KWON BIRTHDAY INVITE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Noto+Sans+KR:wght@100;300;400&display=swap');

        :root {
            --bg-color: #0a0a0a;
            --accent-color: #ffffff;
            --dim-gray: #4a4a4a;
            --point-color: #e5e5e5;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: 'Noto Sans KR', sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 60px 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            background: linear-gradient(145deg, #0f0f0f, #050505);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin: 40px 0;
        }

        /* Chanel-inspired elegant line */
        .line {
            width: 1px;
            height: 80px;
            background-color: var(--accent-color);
            margin: 0 auto 40px auto;
        }

        /* Gentle Monster-inspired experimental typography */
        .header {
            font-family: 'Bodoni Moda', serif;
            font-size: 10px;
            letter-spacing: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: var(--dim-gray);
        }

        .main-title {
            font-family: 'Bodoni Moda', serif;
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 50px;
            font-style: italic;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .content {
            font-weight: 100;
            font-size: 0.9rem;
            line-height: 2;
            letter-spacing: 0.1rem;
            margin-bottom: 60px;
        }

        .info-section {
            border-top: 1px solid var(--dim-gray);
            border-bottom: 1px solid var(--dim-gray);
            padding: 30px 0;
            margin: 40px 0;
        }

        .info-item {
            margin: 15px 0;
        }

        .label {
            font-size: 0.7rem;
            color: var(--dim-gray);
            margin-bottom: 5px;
            display: block;
            letter-spacing: 0.2rem;
        }

        .value {
            font-size: 1.1rem;
            letter-spacing: 0.05rem;
        }

        /* Tamburins-inspired textural detail */
        .footer {
            font-size: 0.7rem;
            color: var(--dim-gray);
            margin-top: 50px;
            font-style: italic;
        }

        .rsvp-btn {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 40px;
            border: 1px solid var(--accent-color);
            background: transparent;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.3rem;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .rsvp-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        /* Decoration elements */
        .circle-blur {
            position: absolute;
            top: 10%;
            left: -10%;
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, 0.04);
            filter: blur(60px);
            border-radius: 50%;
            z-index: -1;
            animation: float 10s ease-in-out infinite;
        }
        
        .circle-blur-2 {
            position: absolute;
            bottom: 5%;
            right: -10%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.03);
            filter: blur(50px);
            border-radius: 50%;
            z-index: -1;
            animation: float 12s ease-in-out infinite reverse;
        }

        @keyframes float {
            0% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-30px) translateX(20px); }
            100% { transform: translateY(0px) translateX(0px); }
        }

        /* Scroll Animations */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center; align-items: center;
            opacity: 0; visibility: hidden;
            transition: all 0.5s ease;
            backdrop-filter: blur(8px);
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1; visibility: visible;
        }

        .modal-content {
            background: #0d0d0d;
            border: 1px solid var(--dim-gray);
            width: 90%; max-width: 380px;
            padding: 50px 30px; 
            text-align: center;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute; top: 15px; right: 20px;
            background: none; border: none; color: var(--dim-gray);
            font-size: 1.8rem; cursor: pointer;
            transition: color 0.3s;
        }
        
        .close-btn:hover { color: white; }

        .modal-title {
            font-family: 'Bodoni Moda', serif;
            font-size: 1.5rem;
            margin-bottom: 30px;
            letter-spacing: 0.1rem;
        }

        .form-group {
            margin-bottom: 25px; text-align: left;
        }

        .form-group label {
            display: block; font-size: 0.75rem; margin-bottom: 8px; 
            color: var(--dim-gray); letter-spacing: 0.1rem;
        }

        .form-group input, .form-group select {
            width: 100%; padding: 12px 0;
            background: transparent; border: none;
            border-bottom: 1px solid var(--dim-gray);
            color: white; font-family: 'Noto Sans KR', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus, .form-group select:focus {
            border-bottom-color: white;
        }

        .form-group select option { background: #0d0d0d; color: white; }

        .submit-btn {
            width: 100%; padding: 15px; margin-top: 10px;
            background: white; color: black; border: none;
            font-size: 0.9rem; font-family: 'Noto Sans KR', sans-serif;
            font-weight: 500; letter-spacing: 0.2rem;
            cursor: pointer; transition: all 0.3s;
        }

        .submit-btn:hover { 
            background: #e5e5e5;
            transform: translateY(-2px);
        }
        
        /* Layout wrapper for flex centering if document gets taller */
        .page-wrapper {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; width: 100%; height: auto; padding: 40px 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    
    <div class="page-wrapper">
        <div class="container fade-in">
            <div class="circle-blur"></div>
            <div class="circle-blur-2"></div>
            
            <div class="line fade-in" style="transition-delay: 0.2s;"></div>
            
            <div class="header fade-in" style="transition-delay: 0.4s;">Private Invitation</div>
            
            <h1 class="main-title fade-in" style="transition-delay: 0.6s;">Hyerim<br>Kwon</h1>
            
            <div class="content fade-in" style="transition-delay: 0.8s;">
                단순함 속에 숨겨진 강렬한 본질,<br>
                2081년의 가을, 권혜림의 감각이 시작되는 그 찰나에<br>
                귀하를 초대합니다.
            </div>

            <div class="info-section fade-in" style="transition-delay: 1.0s;">
                <div class="info-item">
                    <span class="label">DATE</span>
                    <span class="value">2081. 11. 02. 18:00</span>
                </div>
                <div class="info-item">
                    <span class="label">LOCATION</span>
                    <span class="value">JOSUN PALACE HOTEL</span>
                </div>
            </div>

            <button type="button" class="rsvp-btn fade-in" style="transition-delay: 1.2s;" id="open-rsvp">R S V P</button>

            <div class="footer fade-in" style="transition-delay: 1.4s;">
                Unveiling the new atmosphere.
            </div>
        </div>
    </div>

    <!-- RSVP Modal -->
    <div class="modal-overlay" id="rsvp-modal">
        <div class="modal-content">
            <button class="close-btn" id="close-rsvp">&times;</button>
            <div class="modal-title">R S V P</div>
            
            <form onsubmit="return submitRSVP(event)">
                <div class="form-group">
                    <label for="name">NAME / 성함</label>
                    <input type="text" id="name" required placeholder="홍길동">
                </div>
                
                <div class="form-group">
                    <label for="attendance">ATTENDANCE / 참석 여부</label>
                    <select id="attendance" required>
                        <option value="yes">참석합니다 (Will Attend)</option>
                        <option value="no">참석이 어렵습니다 (Unable to Attend)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="message">MESSAGE / 전하실 말씀</label>
                    <input type="text" id="message" placeholder="축하 메시지를 남겨주세요">
                </div>
                
                <button type="submit" class="submit-btn">SEND</button>
            </form>
        </div>
    </div>

    <script>
        // Intersection Observer for scroll animations (Fade-ins)
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // Slight delay to allow DOM render before execution
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, 50);
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in').forEach(elem => {
            observer.observe(elem);
        });

        // Modal Interaction Logic
        const modal = document.getElementById('rsvp-modal');
        const openBtn = document.getElementById('open-rsvp');
        const closeBtn = document.getElementById('close-rsvp');

        openBtn.addEventListener('click', (e) => {
            e.preventDefault();
            modal.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        function submitRSVP(e) {
            e.preventDefault();
            // This is where real API call would go.
            alert('참석 여부가 성공적으로 전달되었습니다.\n감사합니다.');
            modal.classList.remove('active');
            e.target.reset(); // reset form
            return false;
        }
    </script>
</body>
</html>
